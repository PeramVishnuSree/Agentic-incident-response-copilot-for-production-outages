[project]
name = "approval-service"
version = "0.0.1"
description = "Human approval gate + append-only audit log (E8, E10)"
requires-python = ">=3.11"
dependencies = ["copilot-common"]

[tool.uv.sources]
copilot-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["approval_service"]
