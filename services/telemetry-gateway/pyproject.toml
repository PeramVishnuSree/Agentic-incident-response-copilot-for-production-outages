[project]
name = "telemetry-gateway"
version = "0.0.1"
description = "Collects and normalises telemetry into the common event schema (E1, E2)"
requires-python = ">=3.11"
dependencies = [
    "copilot-common",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv.sources]
copilot-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telemetry_gateway"]
