[project]
name = "rca-agent"
version = "0.0.1"
description = "Read-only root-cause analysis agent + model-agnostic LLM interface (E5, E6)"
requires-python = ">=3.11"
dependencies = [
    "copilot-common",
    "langgraph>=0.2",
]

[tool.uv.sources]
copilot-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rca_agent"]
