[project]
name = "remediation-planner"
version = "0.0.1"
description = "Playbook-based remediation planner — drafts plans only (E7)"
requires-python = ">=3.11"
dependencies = [
    "copilot-common",
    "pyyaml>=6.0",
]

[tool.uv.sources]
copilot-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remediation_planner"]
