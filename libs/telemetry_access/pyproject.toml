[project]
name = "telemetry-access"
version = "0.0.1"
description = "Read-only replay and live-neutral telemetry access interface"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "pyarrow>=12.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telemetry_access"]
